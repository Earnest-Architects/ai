<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a11">
<meta name="description" content="API System Enhancer — Architecture Presentation Integrated System Enhancer">
<title>AIレンダリング — API System Enhancer</title>
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- スタイルは css/、スクリプトは js/ に分割 -->
<link rel="stylesheet" href="css/tokens.css?v=1">
<link rel="stylesheet" href="css/base.css?v=2">
<link rel="stylesheet" href="css/controls.css?v=1">
<link rel="stylesheet" href="css/composer.css?v=2">
<link rel="stylesheet" href="css/compare.css?v=1">
<link rel="stylesheet" href="css/settings.css?v=1">
<link rel="stylesheet" href="css/paint.css?v=1">
<link rel="stylesheet" href="css/history.css?v=1">
<link rel="stylesheet" href="css/progress.css?v=1">
</head>
<body>
<main class="hero" id="hero">
  <img id="cap" alt="">
  <canvas id="paint" aria-label="赤ペンのマーク" data-i18n-aria="paint_canvas"></canvas>

  <div id="capEmpty">
    <div class="hero-brand">
      <h1 data-i18n="brand_title">API System Enhancer</h1>
      <p class="hero-sub" data-i18n="brand_sub">Architecture Presentation Integrated System Enhancer</p>
    </div>
    <button type="button" class="upload-card" id="upload-card" aria-label="画像を選択" data-i18n-aria="upload_cta">
      <span class="ico" data-icon="image-plus"></span>
      <span class="upload-title" data-i18n="upload_cta">画像を選択</span>
      <span class="upload-hint" data-i18n="upload_hint">またはドラッグ＆ドロップ — JPG / PNG / WebP</span>
    </button>
  </div>

  <div class="drop-overlay" id="drop-overlay" aria-hidden="true">
    <div class="drop-overlay-inner">
      <span class="ico" data-icon="image-plus"></span>
      <p data-i18n="drop_overlay">ここにドロップして画像を読み込む</p>
    </div>
  </div>

  <div id="cmp" aria-label="元画像と生成結果の比較" data-i18n-aria="compare_aria">
    <img id="cmpA" alt="元画像" data-i18n-alt="compare_original">
    <img id="cmpB" alt="生成結果" data-i18n-alt="compare_result">
    <span class="tag" style="left:10px" data-i18n="compare_original">元画像</span>
    <span class="tag" style="right:10px" data-i18n="compare_result">生成結果</span>
    <div id="bar"></div>
    <div id="knob" role="slider" tabindex="0" aria-label="比較スライダー" data-i18n-aria="compare_slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" data-icon="swap"></div>
  </div>

  <header class="top">
    <div class="brand">
      <img class="brand-logo" src="assets/logo.png" alt="" width="30" height="30" decoding="async">
      <div class="brand-text">
        <span class="brand-title" data-i18n="brand_title">API System Enhancer</span>
        <span class="brand-sub" data-i18n="brand_sub">Architecture Presentation Integrated System Enhancer</span>
      </div>
    </div>
    <nav class="tb" aria-label="ツール" data-i18n-aria="tools_aria">
      <button class="ib" id="closecmp" type="button" data-icon="close" data-tip="比較を閉じる" data-i18n-tip="close_compare" aria-label="比較を閉じる" data-i18n-aria="close_compare" hidden></button>
      <button class="ib" id="chg" type="button" data-icon="image-plus" data-tip="画像を変更" data-i18n-tip="change_image" aria-label="画像を変更" data-i18n-aria="change_image"></button>
      <button class="ib" id="mark" type="button" data-icon="pen" data-tip="赤ペンでマーク" data-i18n-tip="mark" aria-label="赤ペンでマーク" data-i18n-aria="mark" aria-pressed="false" hidden></button>
      <button class="ib" id="hbtn" type="button" data-icon="history" data-tip="履歴" data-i18n-tip="history" aria-label="履歴" data-i18n-aria="history" aria-pressed="false"></button>
      <button class="ib" id="pnl" type="button" data-icon="panel" data-tip="入力パネル" data-i18n-tip="panel" aria-label="入力パネル" data-i18n-aria="panel" aria-pressed="true"></button>
      <button class="ib" id="gear" type="button" data-icon="sliders" data-tip="接続設定" data-i18n-tip="settings" aria-label="接続設定" data-i18n-aria="settings" aria-pressed="false"></button>
      <button class="ib lang" id="lang" type="button" aria-label="Switch to English" data-i18n-aria="lang_to_en" data-tip="Switch to English" data-i18n-tip="lang_to_en">
        <span class="ico" data-icon="lang"></span>
        <span class="lang-label" id="lang-label">EN</span>
      </button>
    </nav>
  </header>
  <input type="file" id="f1" accept="image/*" hidden>

  <div id="set">
    <h2 data-i18n="settings_title">サーバー接続</h2>
    <label class="fld"><span data-icon="server"></span><input id="base" aria-label="サーバーのアドレス" data-i18n-aria="server_addr_aria" placeholder="https://pc名.xxxx.ts.net / http://localhost:8080"></label>
    <label class="fld"><span data-icon="key"></span><input id="key" type="password" aria-label="アクセスキー" data-i18n-aria="access_key_aria" placeholder="アクセスキー(設定時のみ)" data-i18n-ph="access_key_ph" autocomplete="off"></label>
    <button type="button" class="btn-t" id="test" data-i18n="test_connection">接続テスト</button>
    <div id="conn" aria-live="polite"></div>
  </div>

  <div id="tools" class="tb" role="toolbar" aria-label="マークツール" data-i18n-aria="mark_tools_aria">
    <button class="ib" id="tPen" type="button" data-icon="pen" data-tip="赤ペン" data-i18n-tip="pen" aria-label="赤ペン" data-i18n-aria="pen" aria-pressed="true"></button>
    <button class="ib" id="tEr" type="button" data-icon="eraser" data-tip="消しゴム" data-i18n-tip="eraser" aria-label="消しゴム" data-i18n-aria="eraser" aria-pressed="false"></button>
    <label class="sz"><input id="tSize" type="range" min="4" max="80" value="20" aria-label="ペンの太さ" data-i18n-aria="pen_size"></label>
    <button class="ib" id="tUndo" type="button" data-icon="undo" data-tip="元に戻す" data-i18n-tip="undo" aria-label="元に戻す" data-i18n-aria="undo" disabled></button>
    <button class="ib" id="tClr" type="button" data-icon="trash" data-tip="全消去" data-i18n-tip="clear_all" aria-label="全消去" data-i18n-aria="clear_all" disabled></button>
    <button class="ib" id="tDone" type="button" data-icon="check" data-tip="完了" data-i18n-tip="done" aria-label="完了" data-i18n-aria="done"></button>
  </div>

  <aside id="hist" aria-label="生成履歴" data-i18n-aria="history">
    <button class="ib" id="hclr" type="button" data-icon="trash" data-tip="すべて削除" data-i18n-tip="history_clear_all" aria-label="履歴をすべて削除" data-i18n-aria="history_clear_all"></button>
    <div id="hlist"></div>
    <div id="hempty" data-i18n="history_empty">履歴なし</div>
  </aside>

  <div class="acts" id="acts">
    <button class="ib glass" id="use" type="button" data-icon="replace" data-tip="この結果を画像1にする" data-i18n-tip="use_result" aria-label="この結果を画像1にする" data-i18n-aria="use_result"></button>
    <a class="ib glass" id="dl" download="result.png" data-icon="download" data-tip="ダウンロード" data-i18n-tip="download" aria-label="ダウンロード" data-i18n-aria="download"></a>
  </div>

  <section class="composer" aria-label="プロンプト入力" data-i18n-aria="composer_aria">
    <div id="markinfo" aria-live="polite" data-i18n="markinfo">赤マークあり — マーク部分のみ編集します</div>
    <div id="ref-list" class="ref-list" aria-live="polite" aria-label="参照画像" data-i18n-aria="refs_aria"></div>
    <div class="c-row">
      <div class="drop" id="d2" tabindex="0" role="button" aria-label="参照画像を追加 (最大9枚)" data-tip="参照画像を追加 (最大9枚)">
        <span class="ico" data-icon="image-plus"></span>
        <span class="ref-count" id="ref-count" aria-hidden="true">0/9</span>
        <input type="file" id="fref" accept="image/*" multiple hidden>
      </div>
      <textarea id="pos" rows="1" aria-label="プロンプト" data-i18n-aria="prompt_aria" placeholder="どう変えますか? 例: 画像2のソファを画像1に置き換える" data-i18n-ph="prompt_ph"></textarea>
      <button class="go" id="go" type="button" data-icon="spark" aria-label="生成する" data-i18n-aria="generate" data-tip="生成する (Ctrl+Enter)" data-i18n-tip="generate_tip"></button>
    </div>
    <div id="status" aria-live="polite"></div>
  </section>

  <div id="prog">
    <canvas id="fx"></canvas>
    <div class="pc">
      <div class="ringbox" id="ringbox" role="progressbar" aria-label="生成の進捗(目安)" data-i18n-aria="progress_aria" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ee8d2"/><stop offset="1" stop-color="#8fb4ff"/></linearGradient></defs>
          <circle class="bg" cx="60" cy="60" r="52"/>
          <circle class="fg" id="ring" cx="60" cy="60" r="52"/>
          <circle id="tip" cx="112" cy="60" r="3.2"/>
        </svg>
        <div id="pct" aria-hidden="true"><span><b>0</b><i>%</i></span></div>
      </div>
      <div id="stage" aria-live="polite"></div>
      <div id="sub"></div>
      <div id="el"></div>
    </div>
  </div>
</main>

<!-- 読み込み順が依存関係。各ファイルは window.AI に機能を登録する -->
<script src="js/workflow.js?v=2"></script>
<script src="js/core.js?v=2"></script>
<script src="js/i18n.js?v=3"></script>
<script src="js/icons.js?v=1"></script>
<script src="js/fx-shader.js?v=1"></script>
<script src="js/progress.js?v=1"></script>
<script src="js/settings.js?v=1"></script>
<script src="js/viewer.js?v=1"></script>
<script src="js/paint.js?v=1"></script>
<script src="js/history.js?v=1"></script>
<script src="js/api.js?v=2"></script>
<script src="js/generate.js?v=2"></script>
<script src="js/composer.js?v=2"></script>
<script src="js/main.js?v=1"></script>
<!-- 別オリジンの360ツアーから postMessage で画像を受け取るブリッジ(opener が無ければ無効) -->
<script src="js/bridge.js?v=1"></script>
</body>
</html>
